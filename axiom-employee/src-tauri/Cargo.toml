[package]
name = "axiom"
version = "0.4.0"
description = "Axiom Local Privacy Agent"
authors = ["Shrithan Adipuram"]
edition = "2021"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[dependencies]
tauri = { version = "=2.10.2", features = ["macos-private-api", "tray-icon"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "=2.3.3"
notify = "8"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
base64 = "0.22"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSWorkspace", "NSRunningApplication"] }
objc2-foundation = "0.3"

[build-dependencies]
tauri-build = { version = "=2.5.5", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
