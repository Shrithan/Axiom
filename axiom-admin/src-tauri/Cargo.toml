[package]
name = "axiom-admin-lib"
version = "0.1.0"
description = "Axiom Admin — Employer-side management console"
authors     = ["Shrithan Adipuram"]
edition     = "2021"

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
