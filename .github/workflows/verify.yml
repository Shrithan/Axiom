name: Verify experimental release
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            axiom-employee/package-lock.json
            axiom-admin/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install -r axiom-employee/scripts/requirements.txt
      - run: npm ci --prefix axiom-employee
      - run: npm ci --prefix axiom-admin
      - run: python scripts/verify.py --native
